<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3LOCKBOX</title><style>body{margin:0;background:#07090d;color:#f5f7fb;font-family:system-ui}main{width:min(980px,92vw);margin:auto;padding:48px 0}.panel{background:#0e1219;border:1px solid #253041;border-radius:18px;padding:22px;margin-top:18px}h1{font-size:clamp(2.4rem,7vw,5rem);margin:.1em 0}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px;border:1px solid #253041}button{background:#6ee7ff;font-weight:900}.ADMIT{color:#5ee29d}.REVIEW{color:#f5c45e}.REFUSE{color:#ff6b7a}.hash{word-break:break-all;font-family:monospace}</style></head><body><main><small>ELYRIA SYSTEMS / 3LOCKBOX</small><h1>IP ADMISSION GATE</h1><p>IP2Location.io supplies evidence. 3LOCKBOX binds ADMIT, REVIEW, or REFUSE and emits a replayable proof receipt.</p><div class="panel"><input id="ip" value="8.8.8.8"><input id="expected" placeholder="Expected country, e.g. US"><input id="deny" placeholder="Denied countries, comma-separated"><input id="asns" placeholder="Denied ASNs, comma-separated"><label><input id="dc" type="checkbox" style="width:auto"> Review hosting/data-center traffic</label><button id="run">EVALUATE ADMISSION</button></div><div class="panel"><h2 id="decision">WAITING</h2><div id="details">No motion binds before evaluation.</div></div></main><script>const $=id=>document.getElementById(id),csv=v=>v.split(',').map(x=>x.trim()).filter(Boolean);$('run').onclick=async()=>{let body={ip:$('ip').value.trim(),expected_country:$('expected').value.trim()||null,deny_countries:csv($('deny').value),deny_asns:csv($('asns').value),block_datacenter:$('dc').checked,allow_countries:[]};$('decision').textContent='PENDING';try{let r=await fetch('/api/v1/admit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.detail||'failed');$('decision').textContent=d.decision;$('decision').className=d.decision;$('details').innerHTML=`<b>${d.evidence.ip}</b><br>${d.evidence.country_code||'—'} ${d.evidence.country_name||''}<br>ASN ${d.evidence.asn||'—'}<br><br><b>Rules</b><pre>${JSON.stringify(d.rules,null,2)}</pre><b>Decision hash</b><div class="hash">${d.decision_hash}</div>`}catch(e){$('decision').textContent='REFUSED';$('decision').className='REFUSE';$('details').textContent=e.message}};</script></body></html>
