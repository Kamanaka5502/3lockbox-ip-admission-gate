# Illustrative Nginx integration contract.
# Core 3LOCKBOX enforcement endpoint:
#   POST /api/v1/authorize
#   204 => ADMIT
#   403 => REVIEW or REFUSE
# Response headers bind decision, decision hash, ledger hash, and policy version.

upstream protected_app {
    server protected-app:8080;
}

server {
    listen 80;

    location / {
        # Production edge middleware should call 3LOCKBOX /api/v1/authorize
        # with the client IP and active policy before proxying this request.
        proxy_pass http://protected_app;
    }
}
